<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><rect width="740" height="828" x="36" y="36" fill="#fff" stroke="#4f9ee8" stroke-width="6" rx="18"/><rect width="740" height="828" x="824" y="36" fill="#fff" stroke="#35a866" stroke-width="6" rx="18"/><text x="74" y="104" fill="#163b72" font-family="DejaVu Sans" font-size="38" font-weight="700">Keras prediction scores</text><line x1="74" x2="738" y1="132" y2="132" stroke="#d7e7f7" stroke-width="3"/><text x="74" y="192" fill="#202b3f" font-family="DejaVu Sans Mono" font-size="30">preds = model.predict(X)</text><text x="74" y="260" fill="#202b3f" font-family="DejaVu Sans Mono" font-size="30">preds</text><rect width="684" height="284" x="64" y="296" fill="#f4fbf7" stroke="#b9e8cf" stroke-width="4" rx="12"/><text x="86" y="350" fill="#1d5b38" font-family="DejaVu Sans Mono" font-size="26">array([[-1.8682902, -4.7611245,</text><text x="86" y="394" fill="#1d5b38" font-family="DejaVu Sans Mono" font-size="26">-2.3169835, -1.0625703, 9.887159,</text><text x="86" y="438" fill="#1d5b38" font-family="DejaVu Sans Mono" font-size="26">-2.8124335, -3.666283, 3.2003615,</text><text x="86" y="482" fill="#1d5b38" font-family="DejaVu Sans Mono" font-size="26">-2.6023383, -4.8350453]],</text><text x="86" y="526" fill="#1d5b38" font-family="DejaVu Sans Mono" font-size="26">dtype=float32)</text><text x="74" y="642" fill="#40536b" font-family="DejaVu Sans" font-size="25">Ten class scores; the pants score is the largest.</text><text x="862" y="104" fill="#073d2d" font-family="DejaVu Sans" font-size="38" font-weight="700">Convert Keras to TF-Lite</text><line x1="862" x2="1526" y1="132" y2="132" stroke="#d6f0df" stroke-width="3"/><rect width="672" height="394" x="858" y="170" fill="#fbfcfd" stroke="#d6dde5" stroke-width="4" rx="12"/><text x="884" y="236" fill="#202b3f" font-family="DejaVu Sans Mono" font-size="17">converter = tf.lite.TFLiteConverter.from_keras_model(model)</text><text x="884" y="306" fill="#202b3f" font-family="DejaVu Sans Mono" font-size="26">tflite_model = converter.convert()</text><text x="884" y="402" fill="#202b3f" font-family="DejaVu Sans Mono" font-size="17">with open(&apos;clothing-model.tflite&apos;, &apos;wb&apos;) as f_out:</text><text x="884" y="446" fill="#202b3f" font-family="DejaVu Sans Mono" font-size="26">f_out.write(tflite_model)</text><rect width="612" height="88" x="884" y="622" fill="#e9f8ee" rx="12"/><text x="914" y="678" fill="#1b6e3d" font-family="DejaVu Sans Mono" font-size="27" font-weight="700">clothing-model.tflite</text></svg>